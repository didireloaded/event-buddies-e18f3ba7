# Merge only the needed sections into ~/.codex/config.toml.
# This example contains NO secret values. Set API_KEY_21ST privately in your shell/session.

[mcp_servers.shadcn]
command = "npx"
args = ["shadcn@latest", "mcp"]

[mcp_servers."21st"]
url = "https://21st.dev/api/mcp"
bearer_token_env_var = "API_KEY_21ST"
